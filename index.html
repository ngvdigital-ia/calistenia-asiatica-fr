else if(step===24)h=multis('Quelles sont vos préférences alimentaires&nbsp;?','',[['vegetarienne','Je suis végétarienne','Légumes, céréales, sans viande animale','vegetarian-BZpnuIQK.webp'],['vegane','Je suis végane','Uniquement à base de plantes','vegan-DkoJywfO.webp'],['gluten','Sans gluten','Exclut les produits céréaliers contenant du gluten','gluten-free-BrMIw2nS.webp'],['lactose','Sans lactose','Exclut les produits laitiers','lactose-free-wsMFy0Rx.webp'],['aucune','Sans restriction','Tous les aliments me conviennent','no-restrictions-BYq0nylU.webp']].map(([id,label,description,image])=>({id,label,description,image})),'meals');
else if(step===25){let items=[['⌛','Procrastination'],['🍽','Alimentation peu saine'],['📱','Réseaux sociaux'],['☕','Boire beaucoup de caféine'],['📺','Marathons de séries'],['🤔','Doute de soi'],['💅','Se ronger les ongles'],['🕒','Être souvent en retard'],['🚬','Fumer'],['🍷','Boire de l’alcool'],['✕','Aucun de ces éléments']];let selected=state.multi.habits||[];h=layout(heading('Quelles sont vos habitudes&nbsp;?')+`<div class="habit-list">${items.map(([icon,label],i)=>`<button class="answer ${selected.includes(String(i))?'selected':''}" data-a="toggle:habits:${i}"><span class="emoji">${icon}</span><span class="copy">${label}</span><span class="check">${selected.includes(String(i))?'✓':''}</span></button>`).join('')}</div>`+go('Continuer',!selected.length),'narrow s25')}
else if(step===26){let items=[['heart','Mariage ou relation'],['calendar','Grossesse'],['work','Travail intense ou vie familiale'],['brain','Stress ou santé mentale'],['pill','Médicament ou trouble hormonal'],['close','Aucune de ces réponses']];let selected=state.multi.events||[];h=layout(heading('Est-ce que l’un des événements ci-dessous vous a fait prendre du poids ces dernières années&nbsp;?')+`<div class="event-list">${items.map(([icon,label],i)=>`<button class="answer ${selected.includes(String(i))?'selected':''}" data-a="toggle:events:${i}">${eventGlyph(icon)}<span class="copy">${label}</span><span class="check">${selected.includes(String(i))?'✓':''}</span></button>`).join('')}</div>`+go('Étape suivante',!selected.length),'narrow s26')}
else if(step===27)h=inter('Retrouvez votre corps&nbsp;!','woman-motivation-DOIROZwS.webp','Vous ne savez pas par où commencer&nbsp;? Nous avons déjà tout planifié. Vous doutez de pouvoir y arriver&nbsp;? Nous sommes prêtes à vous motiver et à vous accompagner&nbsp;!').replace('class="page narrow"','class="page narrow s27"');
else if(step===28)h=layout(heading('Voici à quoi ressemble la <span class="pink">transformation de votre vie</span>','D’après vos réponses, vous faites partie des femmes qui ont le plus de chances d’atteindre leurs objectifs&nbsp;!')+transformGraph()+`<button class="continue" data-a="next">Continuer</button>`,'narrow s28');

else if(step===32)h=layout(heading('Quelle est votre principale motivation pour transformer votre corps&nbsp;?')+`<div class="choice-list">${[['spark','Me sentir plus confiante dans mon corps.'],['bolt','Être en meilleure santé et avoir plus d’énergie.'],['shirt','Me sentir bien dans mes vêtements.'],['smile','Retrouver mon corps et mon estime après l’accouchement.'],['dots','Autre.']].map(([icon,label],i)=>`<button class="answer arrow-card" data-a="select:motivation:${i}">${motivationGlyph(icon)}<span class="copy">${label}</span><span class="arrow">›</span></button>`).join('')}</div>`,'narrow s32');

else if(step===34)h=planSummary();
else h=vslOffer();document.querySelector('#app').innerHTML=h;bind();scrollTo(0,0)}
function next(){step=Math.min(35,step+1);history.pushState({},'',`/step-${step}`);render()}
function back(){step=Math.max(1,step-1);history.pushState({},'',step===1?'/' : `/step-${step}`);render()}
function bind(){
  document.querySelectorAll('[data-range]').forEach(e=>e.oninput=()=>{state[e.dataset.range]=+e.value;document.querySelector('#value').textContent=e.value});
  let age=document.querySelector('[data-age]');if(age)age.oninput=()=>state.age=age.value;
  document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{
    let a=e.dataset.a;if(a==='next')return next();if(a==='back')return back();if(a==='cta'){e.setAttribute('aria-label','Votre plan est prêt');return}
    let [kind,key,value]=a.split(':');if(kind==='age'){state.ageRange=key;return next()}if(kind==='experience'){state.experience=key;return next()}if(kind==='select'){state.items[key]=value;return next()}
    if(kind==='toggle'){let set=state.multi[key]||[];state.multi[key]=set.includes(value)?set.filter(x=>x!==value):[...set,value];return render()}if(kind==='unit'){unit=key;return render()}
  });
  if(step===29)setTimeout(next,1800);
}
addEventListener('popstate',()=>{step=Math.max(1,Math.min(35,+((location.pathname.match(/step-(\d+)/)||[])[1]||1)));render()});render()})();
