<html lang="fr">

    <style>
      @font-face{font-family:Poppins;font-style:normal;font-weight:400;src:url('/assets/poppins-400.ttf') format('truetype');font-display:swap}
      @font-face{font-family:Poppins;font-style:normal;font-weight:600;src:url('/assets/poppins-600.ttf') format('truetype');font-display:swap}
      @font-face{font-family:Poppins;font-style:normal;font-weight:700;src:url('/assets/poppins-700.ttf') format('truetype');font-display:swap}
      @font-face{font-family:Anton;font-style:normal;font-weight:400;src:url('/assets/anton-400.ttf') format('truetype');font-display:swap}
      :root{--bg:#fafafa;--fg:#282c34;--card:#fff;--muted:#f5f5f5;--muted-fg:#6b7280;--primary:#d64d7a;--accent:#fbeaf0;--border:#e5e7eb;--green:#22c55e;--orange:#f97316}
      *,*:before,*:after{box-sizing:border-box;border-width:0;border-style:solid;border-color:var(--border)}
      html{min-height:100%;font-family:Poppins,system-ui,sans-serif;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
      body{min-height:100%;margin:0;background:var(--bg);color:var(--fg);line-height:1.5;-webkit-font-smoothing:antialiased}
      button,input{font:inherit;color:inherit}button{cursor:pointer}img{display:block;max-width:100%;height:auto}a{color:inherit}
      .app{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
      .header{position:relative;display:flex;align-items:center;justify-content:center;padding:.75rem 1rem;background:var(--card);min-height:58px}
      .brand{display:flex;align-items:center;gap:.375rem}.brand-main{color:var(--primary);font-family:Anton,system-ui,sans-serif;font-size:1.875rem;letter-spacing:.05em;line-height:1.5}.brand-tag{border-radius:.25rem;background:var(--muted);color:var(--muted-fg);padding:.125rem .5rem;font-size:.75rem}
      .back{position:absolute;left:1rem;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;background:transparent;font-size:1.6rem;line-height:1}.back:hover{background:var(--muted)}
      .progress{height:4px;background:#eceef0}.progress>span{display:block;height:100%;background:var(--primary);transition:width .35s ease-out}
      main{display:flex;flex:1;min-height:calc(100vh - 62px);flex-direction:column;overflow-y:auto}.screen{width:100%;max-width:1024px;margin:0 auto;padding:1rem 1rem 5.5rem;animation:appear .22s ease-out}.screen.narrow{max-width:480px}.screen.center{display:flex;min-height:calc(100vh - 62px);align-items:center;justify-content:center}.title{position:relative;z-index:2;width:100%;margin-bottom:1rem;text-align:center}h1{margin:0;color:var(--fg);font-size:1.7rem;font-weight:700;line-height:1.25}.title h1 span,.pink{color:var(--primary)}.subtitle{margin:.5rem 0 0;color:var(--muted-fg);font-size:1rem}.question{margin-top:.75rem;color:var(--fg);font-size:1rem;font-weight:700}
      .age-wrap{position:relative;min-height:500px}.stage1-hero{position:absolute;top:20px;right:-180px;z-index:0;width:420px;height:560px;pointer-events:none;object-fit:contain}.choices{position:relative;z-index:2;width:70%;margin:0 auto}.choice{display:flex;width:100%;min-height:56px;align-items:center;justify-content:space-between;border-radius:.75rem;background:var(--muted);padding:1rem 1.25rem;text-align:left;font-size:1rem;font-weight:600;transition:background-color .15s,transform .15s}.choice+.choice{margin-top:.75rem}.choice:hover{background:#ebebeb;transform:translateY(-1px)}.arrow{font-size:1.35rem;color:var(--muted-fg)}
      .card{width:100%;border:2px solid transparent;border-radius:12px;background:var(--card);box-shadow:0 4px 14px #1d24300d;padding:1rem;text-align:left;transition:border-color .2s,background .2s,transform .15s}.card:hover{border-color:#d1d5db;transform:translateY(-1px)}.card.selected{border-color:var(--primary);background:var(--accent)}.stack{display:grid;gap:.75rem}.cards-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}.card-media{width:100%;height:92px;margin-bottom:.65rem;overflow:hidden;border-radius:9px;background:var(--muted)}.card-media img{width:100%;height:100%;object-fit:cover;object-position:top}.card-row{display:flex;align-items:center;gap:.75rem}.card-icon{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border-radius:10px;background:var(--muted);color:var(--primary);font-size:1.25rem}.card-copy{min-width:0;flex:1}.card-copy strong{display:block;font-size:.96rem}.card-copy small{display:block;margin-top:.125rem;color:var(--muted-fg);font-size:.82rem}.check{width:24px;height:24px;flex:0 0 auto;border:2px solid #b8bec6;border-radius:7px;display:grid;place-items:center;color:white;font-size:.85rem}.selected .check{border-color:var(--primary);background:var(--primary)}
      .stage-head{max-width:640px;margin:0 auto 1.5rem;text-align:center}.stage-head h1{font-size:1.35rem;line-height:1.3}.stage-head p{margin:.5rem 0 0;color:var(--muted-fg)}.media{width:100%;max-width:448px;margin:0 auto 1.5rem;overflow:hidden;border-radius:16px;box-shadow:0 8px 24px #1d243014}.media img{width:100%;height:256px;object-fit:cover}.two-col{display:flex;align-items:center;gap:3rem;max-width:900px;margin:0 auto}.two-col>*{flex:1}.two-col img{width:100%;border-radius:16px}.two-col h1{font-size:clamp(1.35rem,3vw,2.25rem);line-height:1.2;margin-bottom:1rem}.two-col p{color:var(--muted-fg);font-size:1.05rem;line-height:1.7}.two-col strong{color:var(--fg)}
      .btn{display:flex;width:100%;max-width:448px;min-height:52px;align-items:center;justify-content:center;gap:.5rem;margin:1.25rem auto 0;border-radius:12px;background:var(--primary);color:#fff;padding:1rem 1.5rem;font-weight:700;transition:filter .2s,transform .15s}.btn:hover{filter:brightness(.94)}.btn:active{transform:scale(.98)}.btn:disabled{cursor:not-allowed;opacity:.5}.sticky-btn{position:fixed;right:0;bottom:0;left:0;z-index:20;padding:1rem 1.25rem;background:linear-gradient(transparent,var(--bg) 22%)}.sticky-btn .btn{margin:0 auto}.eyebrow{margin-bottom:.5rem;color:var(--primary);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.range-box{max-width:448px;margin:2rem auto}.range-value{margin-bottom:1.5rem;color:var(--primary);font-size:3.75rem;font-weight:700;text-align:center;line-height:1}.range{width:100%;accent-color:var(--primary)}.range-labels{display:flex;justify-content:space-between;margin-top:.5rem;color:var(--muted-fg);font-size:.8rem}.input{width:100%;border:1px solid var(--border);border-radius:12px;background:var(--card);padding:1rem 1.1rem;outline:none}.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #d64d7a22}.email{max-width:448px;margin:1.5rem auto}.loading{text-align:center}.spinner{width:68px;height:68px;margin:1rem auto 2rem;border:5px solid var(--accent);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}.loading-bar{height:10px;overflow:hidden;border-radius:99px;background:var(--muted)}.loading-bar span{display:block;width:100%;height:100%;transform-origin:left;background:var(--primary);animation:load 1.5s ease-out forwards}.summary{max-width:520px;margin:0 auto}.summary-box{margin-bottom:1rem;border-radius:14px;background:var(--card);padding:1.2rem;box-shadow:0 4px 14px #1d24300d}.summary-box h2{margin:0 0 .8rem;color:var(--primary);font-size:1.05rem}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;border-top:1px solid var(--border);padding-top:1rem}.metric label{display:block;color:var(--primary);font-size:.72rem;font-weight:600}.metric strong{font-size:1.1rem}.metric small{display:block;color:var(--muted-fg)}.highlight{border:1px solid #d64d7a33;border-radius:12px;background:#d64d7a12;padding:.9rem}.highlight strong{color:var(--primary)}
      .offer{max-width:560px;margin:0 auto}.offer h1{text-align:center;color:var(--primary);font-size:1.7rem}.offer-sub{text-align:center;color:var(--muted-fg);margin:.5rem 0 1.25rem}.video-panel{display:grid;place-items:center;min-height:250px;margin-bottom:1.25rem;border-radius:16px;background:linear-gradient(145deg,#352633,#17151a);color:white;text-align:center;box-shadow:0 10px 25px #1d243026}.video-play{display:grid;place-items:center;width:72px;height:72px;margin:0 auto .75rem;border-radius:50%;background:var(--primary);font-size:1.6rem}.offer-card{margin:1rem 0;border-radius:14px;background:var(--card);padding:1.2rem;box-shadow:0 4px 14px #1d24300d}.offer-card h2{margin:0 0 1rem;font-size:1.1rem;text-align:center}.benefit{display:flex;gap:.6rem;margin:.7rem 0;font-size:.9rem}.benefit b{color:var(--primary)}.price{text-align:center}.price .old{color:var(--muted-fg);font-size:1.15rem;text-decoration:line-through}.price .now{color:var(--primary);font-size:3rem;font-weight:700;line-height:1}.price p{margin:.45rem 0;color:var(--muted-fg);font-size:.85rem}.testimonial{overflow:hidden;margin:.75rem 0;border-radius:12px;background:var(--card);box-shadow:0 4px 14px #1d24300d}.testimonial img{width:100%;max-height:240px;object-fit:cover}.testimonial div{padding:1rem}.testimonial strong{color:var(--primary)}.faq button{display:flex;width:100%;align-items:center;justify-content:space-between;background:none;padding:.9rem 0;font-weight:600;text-align:left}.faq p{margin:0 0 .9rem;color:var(--muted-fg);font-size:.9rem}.footer{padding:1rem;color:var(--muted-fg);font-size:.72rem;text-align:center}.footer a{text-decoration:underline}
      @keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @media (min-width:768px){.screen{padding:2rem 1.5rem 4rem}.title{max-width:672px;margin:0 auto 2rem}h1{font-size:2.25rem}.subtitle,.question{font-size:1.125rem}.subtitle{margin-top:1rem}.question{margin-top:1.5rem}.choices{width:100%;max-width:448px}.choice{min-height:68px;padding:1.25rem 1.5rem;font-size:1.125rem}.age-wrap{min-height:530px}.stage1-hero{top:auto;right:-120px;bottom:-60px;width:380px;height:500px}.two-col{padding:1.5rem 0}.cards-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.card-media{height:115px}}
      @media (min-width:1024px){.title{max-width:640px}h1{font-size:2.7rem;line-height:1}.stage1-hero{right:-150px;width:420px;height:560px}.choices{max-width:640px}.choice{min-height:83px}.two-col{padding:3rem 0}}
      @media (max-width:600px){.two-col{flex-direction:column;gap:1.25rem}.two-col .copy{order:1}.two-col img{order:2;max-height:330px;object-fit:cover}.cards-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:.75rem}.card-copy strong{font-size:.84rem}.stage1-hero{right:-190px}.choices{width:72%}.summary-grid{gap:.7rem}}
      @media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}}
    </style>
  </head>
  <body>
    <div class="app"><header class="header" id="header"></header><div class="progress" id="progress"><span></span></div><main id="app"></main><footer class="footer">En continuant, vous acceptez nos <a href="#">conditions d’utilisation</a>, notre <a href="#">politique de confidentialité</a> et notre <a href="#">politique de cookies</a>.</footer></div>
    <script>
      (()=>{
        const A='/assets/';
        const state={ageRange:'',experience:'',goal:'',extra:[],zones:[],targetZones:[],bodyType:'',dream:'',history:'',limitations:[],comfort:'',height:165,currentWeight:73,targetWeight:57,age:50,lifestyle:'',energy:'',water:'',sleep:'',meals:[],habits:[],events:[],motivation:'',commitment:'',email:''};
        let step=Math.max(1,Math.min(35,Number((location.pathname.match(/step-(\d+)/)||[])[1]||new URLSearchParams(location.search).get('step')||1)));
        let faqOpen='';
        const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const img=(src,alt,cls='')=>`<img class="${cls}" src="${A+src}" alt="${esc(alt)}" loading="lazy" decoding="async">`;
        const arrow='<span class="arrow" aria-hidden="true">→</span>';
        const card=(label,action,{selected=false,icon='',image='',description='',check=false}={})=>`<button class="card ${selected?'selected':''}" type="button" data-action="${action}">${image?`<div class="card-media">${img(image,label)}</div>`:''}<div class="card-row">${icon?`<span class="card-icon">${icon}</span>`:''}<span class="card-copy"><strong>${label}</strong>${description?`<small>${description}</small>`:''}</span>${check?`<span class="check">${selected?'✓':''}</span>`:arrow}</div></button>`;
        const multi=(title,sub,items,key,button='Continuer')=>{const selected=state[key]||[];return `<section class="screen narrow"><div class="stage-head"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="stack">${items.map((x,i)=>card(x.label,`toggle:${key}:${x.id}`,{selected:selected.includes(x.id),icon:x.icon||'✦',image:x.image,description:x.description,check:true})).join('')}</div><div class="sticky-btn"><button class="btn" type="button" data-action="next" ${selected.length?'':'disabled'}>${button}</button></div></section>`};
        const single=(title,items,key,{images=false,grid=false}={})=>`<section class="screen narrow"><div class="stage-head"><h1>${title}</h1></div><div class="${grid?'cards-grid':'stack'}">${items.map(x=>card(x.label,`select:${key}:${x.id}`,{image:images?x.image:'',icon:x.icon||'✦',description:x.description})).join('')}</div></section>`;
        const btn=label=>`<button class="btn" type="button" data-action="next">${label}</button>`;
        function render(){
          document.title=`Étape ${step} — Calisthénie asiatique`;
          document.getElementById('header').innerHTML=`${step>1?'<button class="back" type="button" data-action="back" aria-label="Retour">‹</button>':''}<div class="brand"><span class="brand-main">CALISTENIA</span><span class="brand-tag">by Atlas</span></div>`;
          document.querySelector('#progress span').style.width=`${Math.min(step/35*100,100)}%`;
          const app=document.getElementById('app');let html='';
          if(step===1)html=`<section class="screen"><div class="title"><h1>Programme de Calisthénie<br>asiatique <span>pour femmes</span></h1><p class="subtitle">TEST D’1 MINUTE</p><div class="question">Quel âge avez-vous&nbsp;?</div></div><div class="age-wrap"><img class="stage1-hero" src="/assets/asian-woman-fitness.webp" alt="Femme asiatique pratiquant la calisthénie" width="420" height="560" loading="eager" fetchpriority="high" decoding="sync"><div class="choices">${['39 – 45','46 – 50','51 – 60','60+'].map(x=>`<button class="choice" type="button" data-action="age:${x}"><span>${x}</span>${arrow}</button>`).join('')}</div></div></section>`;
          else if(step===2)html=`<section class="screen narrow"><div class="media">${img('women-group.webp','Groupe de femmes pratiquant des exercices')}</div><div class="stage-head"><h1>Elles ont réussi, et vous aussi</h1><p>Plus de 27 millions de femmes ont déjà transformé leur vie avec la Calisthénie Asiatique.</p></div>${btn('Continuer')}</section>`;
          else if(step===3)html=`<section class="screen narrow"><div class="stage-head"><h1>Avez-vous déjà essayé des exercices de calisthénie&nbsp;?</h1></div><div class="age-wrap"><img class="stage1-hero" src="/assets/asian-woman-fitness.webp" alt="Femme pratiquant un exercice"><div class="choices">${['Oui','Non'].map(x=>`<button class="choice" type="button" data-action="select:experience:${x==='Oui'?'oui':'non'}"><span>${x}</span>${arrow}</button>`).join('')}</div></div></section>`;
          else if(step===4)html=state.experience==='oui'?explain('Vous avez déjà une base, mais la Calisthénie Asiatique est différente de la calisthénie classique.','La méthode traditionnelle se concentre sur la force extérieure. Notre technique active les fibres profondes, là où se trouve la graisse la plus difficile à éliminer, et aide à relancer le métabolisme.'):explain('Ne vous inquiétez pas : la Calisthénie Asiatique est parfaite pour commencer de zéro !','La calisthénie utilise uniquement le poids du corps. Notre technique se concentre sur l’activation des fibres profondes pour relancer le métabolisme et affiner le ventre sans l’effort épuisant d’une salle de sport.');
          else if(step===5)html=single('Quel est votre objectif principal&nbsp;?',[{id:'perdre',label:'Perdre du poids',icon:'⌁'},{id:'muscles',label:'Développer mes muscles',icon:'◈'},{id:'maintien',label:'Maintenir mon poids et rester en forme',icon:'◉'},{id:'forme',label:'Améliorer ma condition physique',icon:'✦'}],'goal');
          else if(step===6)html=multi('Qu’espérez-vous accomplir avec ce plan&nbsp;?','Vous pouvez choisir plusieurs options.',[{id:'energie',label:'Augmenter mon énergie',icon:'☀'},{id:'sommeil',label:'Améliorer mon sommeil',icon:'☾'},{id:'stress',label:'Réduire le stress',icon:'⌁'},{id:'posture',label:'Améliorer ma posture et ma mobilité',icon:'↕'},{id:'flexibilite',label:'Développer ma souplesse',icon:'✧'}],'extra');
          else if(step===7)html=multi('Quelles zones vous préoccupent le plus&nbsp;?','Sélectionnez toutes les options qui vous concernent.',[{id:'menton',label:'Double menton',image:'asian-woman-fitness.webp'},{id:'bras',label:'Bras relâchés',image:'woman-couch-exercise.webp'},{id:'poitrine',label:'Poitrine relâchée',image:'women-group.webp'},{id:'ventre',label:'Graisse du ventre',image:'asian-woman-fitness.webp'},{id:'hanches',label:'Hanches et cuisses',image:'woman-couch-exercise.webp'},{id:'fesses',label:'Fesses relâchées',image:'asian-woman-fitness.webp'}],'zones','Prochaine étape');
          else if(step===8)html=multi('Quelles sont vos zones cibles&nbsp;?','Choisissez toutes les options applicables.',[{id:'ventre',label:'Ventre',icon:'◒'},{id:'fesses',label:'Fesses',icon:'◒'},{id:'jambes',label:'Jambes',icon:'◒'},{id:'bras',label:'Bras',icon:'◒'},{id:'dos',label:'Dos',icon:'◒'},{id:'taille',label:'Taille',icon:'◒'}],'targetZones','Prochaine étape');
          else if(step===9)html=`<section class="screen narrow"><div class="media">${img('woman-couch-exercise.webp','Femme faisant un signe positif')}</div><div class="stage-head"><h1>Seulement 7 minutes par jour pour transformer votre corps et <span class="pink">relancer votre métabolisme</span>&nbsp;!</h1><p>Le protocole utilise des activations de fibres profondes pour agir là où les exercices classiques n’arrivent pas, simplement et durablement.</p></div>${btn('Continuer')}</section>`;
          else if(step===10)html=single('Comment décririez-vous votre corps actuellement&nbsp;?',[{id:'mince',label:'Mince',image:'asian-woman-fitness.webp'},{id:'fausse-mince',label:'Fausse mince',image:'woman-couch-exercise.webp'},{id:'au-dessus',label:'Au-dessus du poids idéal',image:'women-group.webp'},{id:'surpoids',label:'Surpoids',image:'asian-woman-fitness.webp'}],'bodyType',{images:true,grid:true});
          else if(step===11)html=single('À quoi ressemble le corps de vos rêves&nbsp;?',[{id:'courbes',label:'Avec des courbes',image:'woman-couch-exercise.webp'},{id:'mince',label:'Mince',image:'asian-woman-fitness.webp'},{id:'forme',label:'En forme',image:'women-group.webp'},{id:'tonique',label:'Tonique',image:'asian-woman-fitness.webp'},{id:'satisfaite',label:'Je suis déjà bien dans mon corps',image:'woman-couch-exercise.webp'}],'dream',{images:true});
          else if(step===12)html=single('Quelle est votre expérience avec le fitness&nbsp;?',[{id:'debutante',label:'Je débute',icon:'☆'},{id:'occasionnelle',label:'Je m’entraîne parfois',icon:'◌'},{id:'reguliere',label:'Je m’entraîne régulièrement',icon:'★'},{id:'experte',label:'Je suis expérimentée',icon:'✦'}],'history');
          else if(step===13)html=multi('Avez-vous des limitations physiques&nbsp;?','Cela nous aide à adapter votre programme.',[{id:'genoux',label:'Douleurs aux genoux',icon:'◌'},{id:'dos',label:'Douleurs au dos',icon:'◌'},{id:'articulations',label:'Sensibilité articulaire',icon:'◌'},{id:'aucune',label:'Aucune limitation',icon:'✓'}],'limitations','Continuer');
          else if(step===14)html=single('Quel niveau de confort recherchez-vous&nbsp;?',[{id:'doux',label:'Doux et progressif',icon:'♧'},{id:'modere',label:'Modéré mais efficace',icon:'◈'},{id:'intense',label:'Intense et challengeant',icon:'✦'}],'comfort');
          else if(step===15)html=explain('Vous êtes sur le point de découvrir votre nouvelle routine.','Chaque séance est courte, accessible et pensée pour s’intégrer dans votre quotidien. Avancez à votre rythme : la régularité fera toute la différence.');
          else if(step===16)html=slider('Quelle est votre taille&nbsp;?','height',140,210,state.height,'cm');
          else if(step===17)html=slider('Quel est votre poids actuel&nbsp;?','currentWeight',45,150,state.currentWeight,'kg');
          else if(step===18)html=slider('Quel poids souhaitez-vous atteindre&nbsp;?','targetWeight',40,130,state.targetWeight,'kg');
          else if(step===19)html=slider('Quel âge avez-vous exactement&nbsp;?','age',18,80,state.age,'ans');
          else if(step===20)html=single('Quel est votre niveau d’activité quotidien&nbsp;?',[{id:'sedentaire',label:'Plutôt sédentaire',description:'Je bouge peu pendant la journée',icon:'◌'},{id:'modere',label:'Modérément active',description:'Je marche et je bouge régulièrement',icon:'◈'},{id:'active',label:'Très active',description:'Je suis souvent en mouvement',icon:'✦'}],'lifestyle');
          else if(step===21)html=multi('Comment est votre énergie au quotidien&nbsp;?','Sélectionnez ce qui vous correspond le mieux.',[{id:'basse',label:'Énergie basse et fatigue fréquente',icon:'↓'},{id:'variable',label:'Énergie variable',icon:'↕'},{id:'bonne',label:'Bonne énergie',icon:'↑'}],'energy','Continuer');
          else if(step===22)html=single('Combien d’eau buvez-vous chaque jour&nbsp;?',[{id:'peu',label:'Moins d’un litre',icon:'◌'},{id:'normal',label:'Entre 1 et 2 litres',icon:'◉'},{id:'beaucoup',label:'Plus de 2 litres',icon:'💧'}],'water');
          else if(step===23)html=single('Combien d’heures dormez-vous en moyenne&nbsp;?',[{id:'moins6',label:'Moins de 6 heures',icon:'☾'},{id:'6a8',label:'Entre 6 et 8 heures',icon:'◐'},{id:'plus8',label:'Plus de 8 heures',icon:'☀'}],'sleep');
          else if(step===24)html=multi('Quelles préférences alimentaires avez-vous&nbsp;?','Vous pouvez choisir plusieurs options.',[{id:'sans-gluten',label:'Sans gluten',icon:'◌'},{id:'sans-lactose',label:'Sans lactose',icon:'◌'},{id:'vegetarienne',label:'Végétarienne',icon:'♧'},{id:'aucune',label:'Aucune restriction',icon:'✓'}],'meals','Continuer');
          else if(step===25)html=multi('Quelles habitudes souhaitez-vous améliorer&nbsp;?','Sélectionnez les sujets qui vous intéressent.',[{id:'alimentation',label:'Mon alimentation',icon:'◈'},{id:'routine',label:'Ma routine d’exercice',icon:'✦'},{id:'sommeil',label:'Mon sommeil',icon:'☾'},{id:'stress',label:'Ma gestion du stress',icon:'⌁'}],'habits','Continuer');
          else if(step===26)html=multi('Avez-vous vécu un changement récent&nbsp;?','Votre réponse nous aide à personnaliser le programme.',[{id:'grossesse',label:'Grossesse ou post-partum',icon:'♡'},{id:'menopause',label:'Ménopause',icon:'◌'},{id:'changement',label:'Changement de rythme de vie',icon:'↗'},{id:'aucun',label:'Aucun changement particulier',icon:'✓'}],'events','Continuer');
          else if(step===27)html=single('Qu’est-ce qui vous motive le plus&nbsp;?',[{id:'confiance',label:'Me sentir plus confiante',icon:'♡'},{id:'sante',label:'Prendre soin de ma santé',icon:'✦'},{id:'energie',label:'Retrouver mon énergie',icon:'☀'},{id:'apparence',label:'Aimer davantage mon apparence',icon:'◈'}],'motivation');
          else if(step===28)html=`<section class="screen narrow"><div class="media">${img('asian-woman-fitness.webp','Femme confiante pratiquant la calisthénie')}</div><div class="stage-head"><div class="eyebrow">Votre transformation commence ici</div><h1>Votre programme personnalisé prend forme</h1><p>Nous avons enregistré vos réponses. Encore quelques instants pour préparer votre parcours.</p></div>${btn('Continuer')}</section>`;
          else if(step===29)html=`<section class="screen center"><div class="loading narrow"><div class="spinner" aria-hidden="true"></div><h1>Nous préparons votre plan personnalisé</h1><p class="subtitle">Analyse de vos réponses…</p><div class="loading-bar"><span></span></div><button class="btn" type="button" data-action="next">Continuer</button></div></section>`;
          else if(step===30)html=projection();
          else if(step===31)html=profile();
          else if(step===32)html=single('Quel degré de confiance avez-vous pour vous remettre en forme&nbsp;?',[{id:'decidee',label:'Je suis déterminée à commencer !',icon:'✦'},{id:'ouverte',label:'Je suis prête à essayer quelque chose de nouveau !',icon:'♡'},{id:'incertaine',label:'Je ressens encore quelques doutes, mais je veux changer !',icon:'↗'}],'motivation');
          else if(step===33)html=single('Quand souhaitez-vous commencer&nbsp;?',[{id:'maintenant',label:'Dès aujourd’hui',icon:'⚡'},{id:'semaine',label:'Cette semaine',icon:'◷'},{id:'bientot',label:'Dans les prochains jours',icon:'✦'}],'commitment');
          else if(step===34)html=summary();
          else html=offer();
          app.innerHTML=html;bind();window.scrollTo({top:0,behavior:'auto'});
        }
        function explain(title,text){return `<section class="screen"><div class="two-col"><div class="copy"><h1>${title}</h1><p>${text}</p>${btn('Continuer')}</div>${img('woman-couch-exercise.webp','Femme pratiquant un exercice')}</div></section>`}
        function slider(title,key,min,max,value,unit){return `<section class="screen narrow"><div class="stage-head"><h1>${title}</h1><p>Faites glisser pour sélectionner votre réponse.</p></div><div class="range-box"><div class="range-value"><output id="range-output">${value}</output><small>${unit}</small></div><input class="range" type="range" min="${min}" max="${max}" value="${value}" data-range="${key}" aria-label="${title}"><div class="range-labels"><span>${min} ${unit}</span><span>${max} ${unit}</span></div>${btn('Continuer')}</div></section>`}
        function projection(){const bmi=state.currentWeight/Math.pow(state.height/100,2);const text=bmi>=27?'Votre plan donnera la priorité à une progression douce et régulière.':'Votre profil est idéal pour une progression équilibrée et durable.';return `<section class="screen narrow"><div class="stage-head"><div class="eyebrow">Projection personnalisée</div><h1>Votre objectif est à portée de main</h1><p>${text}</p></div><div class="summary-box"><div class="summary-grid"><div class="metric"><label>Poids actuel</label><strong>${state.currentWeight} kg</strong></div><div class="metric"><label>Objectif</label><strong>${state.targetWeight} kg</strong></div></div></div>${btn('Continuer')}</section>`}
        function profile(){return `<section class="screen narrow"><div class="stage-head"><div class="eyebrow">Votre profil est prêt</div><h1>Votre plan de Calisthénie Asiatique est presque terminé&nbsp;!</h1><p>Nous avons adapté les prochaines étapes à vos objectifs et à votre quotidien.</p></div><div class="summary-box"><h2>Votre profil</h2><div class="summary-grid"><div class="metric"><label>Taille</label><strong>${state.height} cm</strong></div><div class="metric"><label>Âge</label><strong>${state.age} ans</strong></div><div class="metric"><label>Poids actuel</label><strong>${state.currentWeight} kg</strong></div><div class="metric"><label>Poids souhaité</label><strong>${state.targetWeight} kg</strong></div></div></div>${btn('Continuer')}</section>`}
        function summary(){return `<section class="screen narrow"><div class="stage-head"><div class="eyebrow">Dernière vérification</div><h1>Votre plan de Calisthénie Asiatique est prêt&nbsp;!</h1><p>Voici les informations utilisées pour personnaliser votre parcours.</p></div><div class="summary"><div class="summary-box"><h2>Votre objectif</h2><p>${esc(state.goal||'Transformation globale')}</p><div class="summary-grid"><div class="metric"><label>Poids actuel</label><strong>${state.currentWeight} kg</strong></div><div class="metric"><label>Poids souhaité</label><strong>${state.targetWeight} kg</strong></div><div class="metric"><label>Âge</label><strong>${state.age} ans</strong></div><div class="metric"><label>Activité</label><strong>${esc(state.lifestyle||'À définir')}</strong></div></div></div><div class="highlight"><strong>Focus du protocole :</strong> des séances simples, sans impact, adaptées à votre rythme et à vos objectifs.</div></div>${btn('Découvrir mon plan')}</section>`}
        function offer(){const benefits=['Activation des fibres profondes pour relancer le métabolisme.','Calendrier « ventre plat » avec un parcours jour après jour.','Guide d’alimentation métabolique avec des recettes pratiques.','Récupération articulaire et exercices doux sans impact.','Séances rapides de 10 à 20 minutes.'];const faqs=[['Quels exercices la calisthénie inclut-elle&nbsp;?','Des mouvements au poids du corps comme les squats, les planches, les pompes adaptées et les exercices de mobilité.'],['Comment le programme est-il personnalisé&nbsp;?','Vos réponses permettent d’adapter le parcours à votre âge, vos objectifs et vos éventuelles limitations.'],['Comment accéder à mon plan&nbsp;?','Votre plan personnalisé est disponible après la confirmation de votre accès.']];return `<section class="screen"><div class="offer"><h1>Votre plan de Calisthénie Asiatique est prêt&nbsp;!</h1><p class="offer-sub">Découvrez le parcours conçu à partir de vos réponses.</p><div class="video-panel" role="img" aria-label="Présentation du programme"><div><div class="video-play">▶</div><strong>Présentation du programme</strong><div>Un parcours simple, progressif et accessible</div></div></div><a class="btn" href="#" data-action="local-cta">Obtenir mon plan personnalisé</a><div class="offer-card"><h2>Ce que vous allez recevoir</h2>${benefits.map(x=>`<div class="benefit"><b>✓</b><span>${x}</span></div>`).join('')}${img('app-mockup-B3X03Zx2.webp','Application Calisthénie Asiatique Atlas')}</div><div class="offer-card price"><div class="old">De 297 €</div><div class="now">37,90 €</div><p>Accès complet au programme · Paiement unique</p><p>🔒 Achat sécurisé · Garantie de 30 jours</p></div><a class="btn" href="#" data-action="local-cta">Obtenir mon plan personnalisé</a><div class="offer-card"><h2>Questions fréquentes</h2><div class="faq">${faqs.map(([q,a],i)=>`<div><button type="button" data-action="faq:${i}"><span>${q}</span><span>${faqOpen===String(i)?'−':'+'}</span></button>${faqOpen===String(i)?`<p>${a}</p>`:''}</div>`).join('')}</div></div><p class="subtitle" style="text-align:center;font-size:.75rem">Termes de Service · Politique de Confidentialité</p></div></section>`}
        function next(){step=Math.min(35,step+1);history.pushState({step},'',`/step-${step}`);render()}
        function back(){step=Math.max(1,step-1);history.pushState({step},'',step===1?'/' : `/step-${step}`);render()}
        function bind(){document.querySelectorAll('[data-range]').forEach(el=>el.addEventListener('input',()=>{state[el.dataset.range]=Number(el.value);const o=document.getElementById('range-output');if(o)o.textContent=el.value}));document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{const action=el.dataset.action;if(action==='next'){next();return}if(action==='back'){back();return}if(action.startsWith('age:')){state.ageRange=action.slice(4);next();return}if(action.startsWith('select:')){const [,key,val]=action.split(':');state[key]=val;next();return}if(action.startsWith('toggle:')){const [,key,val]=action.split(':');if(!Array.isArray(state[key]))state[key]=[];state[key]=state[key].includes(val)?state[key].filter(x=>x!==val):[...state[key],val];render();return}if(action.startsWith('faq:')){faqOpen=faqOpen===action.slice(4)?'':action.slice(4);render();return}if(action==='local-cta'){el.setAttribute('aria-label','Votre plan est prêt');return}}))}
        addEventListener('popstate',()=>{step=Math.max(1,Math.min(35,Number((location.pathname.match(/step-(\d+)/)||[])[1]||1)));render()});
        render();
      })();
    </script>
  </body>
</html>
