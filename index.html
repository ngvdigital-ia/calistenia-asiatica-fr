<script>
(()=>{const A='/assets/';const state={experience:'',height:165,weight:73,target:57,age:'',items:{},multi:{}};let step=Math.max(1,Math.min(35,+((location.pathname.match(/step-(\d+)/)||[])[1]||1)));let unit='cm';
const img=(n,a='')=>`<img src="${A+n}" alt="${a}" loading="lazy" decoding="async">`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function head(){return `<button class="back" data-a="back" aria-label="Retour">‹</button><div class="brand">CALISTENIA<small>by Atlas</small></div>`}function layout(content,cls='narrow'){return `<section class="page ${cls}">${content}</section>`}function heading(t,p=''){return `<div class="heading"><h1>${t}</h1>${p?`<p>${p}</p>`:''}</div>`}function go(label='Continuer',disabled=false){return `<div class="next"><button data-a="next" ${disabled?'disabled':''}>${label}</button></div>`}
function choice(x,key,{multi=false,images=false,emoji=false}={}){let chosen=multi?(state.multi[key]||[]).includes(x.id):state.items[key]===x.id;return `<button class="answer ${chosen?'selected':''}" data-a="${multi?'toggle':'select'}:${key}:${x.id}">${x.image?`<span class="thumb">${img(x.image,x.label)}</span>`:emoji?`<span class="emoji">${x.icon}</span>`:x.icon?`<span class="emoji">${x.icon}</span>`:''}<span class="copy">${esc(x.label)}${x.description?`<small>${esc(x.description)}</small>`:''}</span>${multi?`<span class="check">${chosen?'✓':''}</span>`:'<span class="arrow">›</span>'}</button>`}

else if(step===18)h=slider('Quel est votre poids cible&nbsp;?','target',40,130,state.target,'kg');
else if(step===19)h=layout(heading('Quel âge avez-vous&nbsp;?','Les personnes plus âgées ont souvent un pourcentage de graisse corporelle plus élevé à IMC égal.')+`<input class="age-input" inputmode="numeric" placeholder="Saisissez votre âge" value="${esc(state.age)}" data-age><button class="continue" style="margin-top:22px" data-a="next">Étape suivante</button>`);
else if(step===20)h=singles('Comment décririez-vous votre journée type&nbsp;?',[['sedentaire','Sédentaire','Je passe la majeure partie de ma journée assise','sedentary-cjyr6e_x.webp'],['moderee','Activité modérée','Je fais des pauses actives','moderate-Bt8G1F_-.webp'],['active','Je suis infatigable','Je suis debout toute la journée','active-Bdp4d3Tt.webp']].map(([id,label,description,image])=>({id,label,description,image})),'lifestyle');
else if(step===21)h=singles('Comment sont vos niveaux d’énergie pendant la journée&nbsp;?',['Bas, je me sens fatiguée toute la journée','Baisse d’énergie après le déjeuner','Fatiguée avant les repas','Élevé et stable'].map((label,i)=>({id:i,label})),'energy');
else if(step===22)h=layout(heading('Combien d’eau buvez-vous chaque jour&nbsp;?')+`<div class="split"><div class="choice-list">${['Je bois seulement du café ou du thé','Environ 2 verres (0,5 L)','De 2 à 6 verres (0,5–1,5 L)','Plus de 6 verres'].map((label,i)=>choice({id:i,label},'water')).join('')}</div>${img('woman-drinking-water-BLgcZVl1.webp','Femme buvant de l’eau')}</div>`,'');
else if(step===23)h=layout(heading('Combien d’heures dormez-vous habituellement&nbsp;?')+`<div class="split"><div class="choice-list">${['Moins de 5 heures','5–6 heures','7–8 heures','Plus de 8 heures'].map((label,i)=>choice({id:i,label},'sleep')).join('')}</div><picture><source media="(max-width:600px)" srcset="/assets/woman-sleeping-mobile-CwFeGCXZ.webp">${img('woman-sleeping-DwdH-tAw.webp','Femme dormant')}</picture></div>`,'');
else if(step===24)h=multis('Quelles sont vos préférences alimentaires&nbsp;?','',[['vegetarienne','Je suis végétarienne','Légumes, céréales, sans viande animale','vegetarian-BZpnuIQK.webp'],['vegane','Je suis végane','Uniquement à base de plantes','vegan-DkoJywfO.webp'],['gluten','Sans gluten','Exclut les produits céréaliers contenant du gluten','gluten-free-BrMIw2nS.webp'],['lactose','Sans lactose','Exclut les produits laitiers','lactose-free-wsMFy0Rx.webp'],['aucune','Sans restriction','Tous les aliments me conviennent','no-restrictions-BYq0nylU.webp']].map(([id,label,description,image])=>({id,label,description,image})),'meals');
else if(step===25)h=multis('Avez-vous l’une de ces habitudes&nbsp;?','', ['Manger par émotion ou ennui','Manger trop','Grignoter le soir','Sauter trop souvent des repas','Aucune des réponses ci-dessus'].map((label,i)=>({id:i,label,icon:'•'})),'habits');
else if(step===26)h=multis('Qu’ajouteriez-vous à la Calisthénie&nbsp;?','', ['Yoga','Barre au sol','Renforcement musculaire','Marche'].map((label,i)=>({id:i,label,icon:'✦'})),'activities');
else if(step===27)h=inter('Ce qui vous motive vraiment','woman-motivation-DOIROZwS.webp','Votre plan est conçu pour vous aider à tenir dans la durée.');
else if(step===28)h=inter('Découvrez votre transformation possible','transformation-1-a90ZzNIx.webp','Chaque petite action peut vous rapprocher de votre objectif.');
else if(step===29)h=layout(`<div class="loading"><div class="loader"></div><h1>Analyse de vos données…</h1><p class="note">Nous préparons vos recommandations personnalisées.</p></div>`);
else if(step===30)h=graph();
else if(step===31)h=layout(heading('Votre profil est prêt','Nous avons préparé les recommandations adaptées à vos réponses.')+`<div class="chart"><strong>Votre plan de Calisthénie Asiatique est presque prêt.</strong><p class="note">Il tient compte de votre rythme, de vos objectifs et de votre confort.</p></div>`+go());
else if(step===32)h=singles('Qu’est-ce qui vous fera commencer maintenant&nbsp;?',['Retrouver confiance en moi','Me sentir bien dans mes vêtements','Avoir plus d’énergie chaque jour'].map((label,i)=>({id:i,label,icon:['✨','♡','⚡'][i]})),'start');
else if(step===33)h=singles('Quand allez-vous commencer&nbsp;?',['Aujourd’hui','Cette semaine','Dans les prochains jours'].map((label,i)=>({id:i,label,icon:['⚡','◷','✦'][i]})),'commitment');
else if(step===34)h=layout(heading('Votre plan personnalisé','Voici les informations prises en compte pour créer votre parcours.')+`<div class="chart"><div class="benefit"><b>✓</b><span>Objectif, rythme et préférences personnalisés</span></div><div class="benefit"><b>✓</b><span>Séances progressives et accessibles</span></div><div class="benefit"><b>✓</b><span>Conseils pour maintenir votre régularité</span></div></div>`+go());
else h=offer();document.querySelector('#app').innerHTML=h;bind();scrollTo(0,0)}
function next(){step=Math.min(35,step+1);history.pushState({},'',`/step-${step}`);render()}
function back(){step=Math.max(1,step-1);history.pushState({},'',step===1?'/' : `/step-${step}`);render()}
function bind(){
  document.querySelectorAll('[data-range]').forEach(e=>e.oninput=()=>{state[e.dataset.range]=+e.value;document.querySelector('#value').textContent=e.value});
  let age=document.querySelector('[data-age]');if(age)age.oninput=()=>state.age=age.value;
  document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{
    let a=e.dataset.a;if(a==='next')return next();if(a==='back')return back();if(a==='cta'){e.setAttribute('aria-label','Votre plan est prêt');return}
    let [kind,key,value]=a.split(':');if(kind==='age'){state.ageRange=key;return next()}if(kind==='experience'){state.experience=key;return next()}if(kind==='select'){state.items[key]=value;return next()}
    if(kind==='toggle'){let set=state.multi[key]||[];state.multi[key]=set.includes(value)?set.filter(x=>x!==value):[...set,value];return render()}if(kind==='unit'){unit=key;return render()}
  });
  if(step===29)setTimeout(next,1800);
}
addEventListener('popstate',()=>{step=Math.max(1,Math.min(35,+((location.pathname.match(/step-(\d+)/)||[])[1]||1)));render()});render()})();
</script></body></html>
