      @font-face { font-family: Poppins; font-style: normal; font-weight: 600; src: url("assets/poppins-600.ttf") format("truetype"); font-display: swap; }

      :root {

      .app { display: flex; height: 100vh; flex-direction: column; overflow: hidden; background: var(--background); }

      .frame { position: relative; display: flex; min-height: 0; flex: 1 1 0%; flex-direction: column; }
      .content { position: relative; display: flex; min-height: 0; flex: 1 1 0%; flex-direction: column; align-items: center; justify-content: flex-start; overflow-x: clip; padding: 1rem 1rem 1.5rem; }
      .title { position: relative; z-index: 10; width: 100%; margin-bottom: 1rem; text-align: center; }
      h1 { margin: 0; color: var(--foreground); font-size: 1.7rem; font-weight: 700; line-height: 1.25; }
      .title h1 span { color: var(--primary); }
      .subtitle { margin: .5rem 0 0; color: var(--muted-foreground); font-size: 1rem; }
      .question { margin-top: .75rem; color: var(--foreground); font-size: 1rem; font-weight: 700; }
      .choices-wrap { position: relative; width: 100%; }

      .choices { position: relative; z-index: 10; width: 70%; padding-bottom: 2rem; }
      .choice { display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: space-between; border: 0; border-radius: .75rem; background: #f5f5f5; padding: 1rem 1.25rem; text-align: left; font-size: 1rem; font-weight: 600; transition: background-color .15s; }
      .choice + .choice { margin-top: .75rem; }
      .choice:hover { background: #ebebeb; }
      .choice svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; color: var(--muted-foreground); }
      .spacer { height: 500px; }
      footer { margin-top: auto; padding: 1rem; color: var(--muted-foreground); text-align: center; font-size: .75rem; }
      footer p { margin: 0; }

      @media (min-width: 768px) {

        .question { margin-top: 1.5rem; }
        .choices-wrap { max-width: 42rem; }
        .hero { top: auto; right: -120px; bottom: -60px; width: 380px; height: 500px; }

        .spacer { height: 100px; }
      }

        .choices { max-width: 40rem; }
